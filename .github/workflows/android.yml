name: Build Android APK

# Builds the Capacitor Android app in CI, because the Android SDK and JDK live
# on GitHub's runners rather than on a dev machine. Every push to main produces
# a downloadable artifact; pushing a v* tag also publishes a GitHub Release,
# which is what the website's Download button links to.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Bundle the web client into www/
        run: node scripts/build-www.js "${{ vars.PORTAL_RUSH_SERVER || 'https://portal-rush.onrender.com' }}"

      - name: Generate the Android project
        # The android/ folder is generated rather than committed, so it always
        # matches the installed Capacitor version.
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/portal-rush.apk
          ls -lh dist/portal-rush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: portal-rush-apk
          path: dist/portal-rush.apk
          if-no-files-found: error

      - name: Publish release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/portal-rush.apk
          generate_release_notes: true
